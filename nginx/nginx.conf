events {}

http {
  client_max_body_size 512m;
  upstream api { server backend:8000; }
  upstream ui { server frontend:4173; }

  server {
    listen 80;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /ws/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    location /media/ { proxy_pass http://api; }
    location / { proxy_pass http://ui; proxy_set_header Host $host; }
  }
}
